name: Jekyll to Github Pages with WASM demo

# By default, runs if you push to main. keeps your deployed app in sync with main branch.
on:
  push:
    branches:
      - main
# to only run when you do a new github release, comment out above part and uncomment the below trigger.
# on:
#   release:
#     types:
#       - published

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "jekyll"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # repo checkout
      - name: Setup toolchain for wasm
        run: |
          rustup update stable
          rustup default stable
          rustup set profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Download and install Trunk binary
        run: wget -qO- https://github.com/thedodd/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf-

      - name: Build WASM files collection (into demo/dist)
        run: cd demo && ../trunk build --release --public-url $public_url
        env:
          public_url: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/mockup"

      - name: Print current working directory
        run: pwd

      - name: List directory contents, and demo subdir
        run: ls -al /home/runner/work/mcaux-ct/mcaux-ct/ /home/runner/work/mcaux-ct/mcaux-ct/demo /home/runner/work/mcaux-ct/mcaux-ct/demo/dist

      - name: Wipe demo/target (why is this getting into artifact?)
        run: rm -rf demo/target

      - name: Setup Ruby for Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          cache-version: 0

      - name: Install dependencies
        run: bundle install

      - name: Build via Jekyll
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Integrate demo as "mockup" so Jekyll can build docs under "demo"
        run: mkdir _site/mockup && mv demo/dist/* _site/mockup

      - name: Build release .bin for rp235x
        run: |
          rustup target add thumbv8m.main-none-eabihf
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi
          cd mcaux-app
          cargo build --release
          RELDIR=../_site/DFU/mcaux-app/pico2w/latest
          export RELDIR
          mkdir -p $RELDIR
          cp target/thumbv8m.main-none-eabihf/release/mcaux-app $RELDIR/release.elf
          (cd $RELDIR && arm-none-eabi-objcopy -O binary -S release.elf release.bin)
          cargo metadata --format-version 1 --no-deps|jq -r '.packages[0].version' > $RELDIR/version
          ls -l $RELDIR/release.bin | awk '{print $4}' > $RELDIR/size

      - name: Prove the resulting site matches expectations
        run: ls -lR _site

      - name: upload artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages at swork.github.io/mcaux-ct
        id: deployment
        uses: actions/deploy-pages@v4
