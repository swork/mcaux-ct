on: [push, pull_request, workflow_dispatch]

name: CI rp235x

env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcaux-rp235x
    steps:
      - uses: actions/checkout@v4
      - run: pwd
        name: What dir are we in after checkout?
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        name: toolchain
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: thumbv8m.main-none-eabihf
      - run: cd mcaux-rp235x && cargo check --all-features --target thumbv8m.main-none-eabihf
        env:
          ACCESS_POINTS: ${{ secrets.ACCESS_POINTS }}

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcaux-rp235x
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcaux-rp235x
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: clippy
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: -- -D warnings
        env:
          ACCESS_POINTS: ${{ secrets.ACCESS_POINTS }}

  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mcaux-rp235x
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: none
          TARGET: arm-none-eabi

    steps:
    - name: Building ${{ matrix.TARGET }}
      run: echo "${{ matrix.TARGET }}"

    - uses: actions/checkout@master
    - uses: actions-rust-lang/setup-rust-toolchain@v1.0.1
      with:
        toolchain: stable
        target: thumbv8m.main-none-eabihf
        override: true

    - uses: actions-rs/cargo@v1
      with:
        use-cross: true
        command: build
        args: --verbose --release --target thumbv8m.main-none-eabihf
      env:
        ACCESS_POINTS: ${{ secrets.ACCESS_POINTS }}
