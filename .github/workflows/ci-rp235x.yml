on: [push, pull_request, workflow_dispatch]

name: CI rp235x

env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcaux-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: thumbv8m.main-none-eabihf
      - run: cargo check --features rp235xa --target thumbv8m.main-none-eabihf

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcaux-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: thumbv8m.main-none-eabihf
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcaux-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: thumbv8m.main-none-eabihf
          components: clippy
      - run: cargo clippy --features rp235xa -- -D warnings

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcaux-app
    steps:
      - uses: actions/checkout@master
      - uses: actions-rust-lang/setup-rust-toolchain@v1.0.1
        with:
          toolchain: stable
          target: thumbv8m.main-none-eabihf
          override: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi
      - run: mkdir -p _site/dfu/pico2w/latest
      - run: cargo build --features rp235xa --release
      - run: cp target/thumbv8m.main-none-eabihf/release/mcaux-app _site/dfu/pico2w/latest/mcaux-app.elf
      - run: arm-none-eabi-objcopy -O binary -S _site/dfu/pico2w/latest/mcaux-app.elf _site/dfu/pico2w/latest/mcaux-app.bin
      - run: ls -l _site/dfu/pico2w/latest/mcaux-app.bin | awk '{print $5}' > _site/dfu/pico2w/latest/size
      - run: ls -lR _site
      - run: cargo metadata --format-version 1 --no-deps |jq -r '.packages[0].version'
      - run: cargo metadata --format-version 1 --no-deps |jq -r '.packages[0].version' > _site/dfu/pico2W/latest/version

      - name: Quick check what's getting installed
        run: ls -lR _site

      - name: upload
        id: deployment
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages at swork.github.io/mcaux-ct
        id: deployment
        uses: actions/deploy-pages@v4
