name: Github Pages

# By default, runs if you push to main. keeps your deployed app in sync with main branch.
on:
  push:
    branches:
      - main
# to only run when you do a new github release, comment out above part and uncomment the below trigger.
# on:
#   release:
#     types:
#       - published

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "jekyll"
  cancel-in-progress: false

jobs:
  build-github-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # repo checkout
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Install dependencies
        run: bundle install

      - name: Build via Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.putputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-github-pages
    steps:
      - name: Deploy to GitHub Pages at swork.github.io/mcaux-ct
        id: deployment
        uses: actions/deploy-pages@v4
