name: swork.github.io mcaux-ct subtree build

# By default, runs if you push to main. keeps your deployed app in sync with main branch.
on:
  push:
    branches:
      - main
# to only run when you do a new github release, comment out above part and uncomment the below trigger.
# on:
#   release:
#     types:
#       - published

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "jekyll"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # repo checkout
      - name: Setup toolchain for wasm
        run: |
          rustup update stable
          rustup default stable
          rustup set profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Build release for default target
        run: |
          rustup target add thumbv8m.main-none-eabihf
          rustup target add thumbv6m-none-eabi
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi
          cargo install --target `rustc -vV | sed -nE 's/host: (.*)/\1/p'` --path cargo-utility-section cargo-utility-section
          cd mcaux
          make clean
          DFU0=https://swork.github.io/mcaux-ct/DFU/ AP0=SSID PW0=password make tarballz
          mkdir -p _site/DFU
          cp b/archive/*.tar.gz _site/DFU
          (cd _site/DFU && tar -xzf *.tar.gz)

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Download and install Trunk binary
        run: wget -qO- https://github.com/thedodd/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf-

      - name: Build WASM files collection (into demo/dist)
        run: cd demo && ../trunk build --release --public-url $public_url
        env:
          public_url: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/mockup"

      - name: Print current working directory
        run: pwd

      - name: Wipe a few not-wanted things
        run: rm -rf demo/target b

      - name: List directory contents, and demo subdir
        run: ls -al /home/runner/work/mcaux-ct/mcaux-ct/ /home/runner/work/mcaux-ct/mcaux-ct/demo /home/runner/work/mcaux-ct/mcaux-ct/demo/dist

      - name: Setup Ruby for Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          cache-version: 0

      - name: Install dependencies
        run: bundle install

      - name: Build via Jekyll
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Integrate demo as "mockup" so Jekyll can build docs under "demo"
        run: mkdir _site/mockup && mv demo/dist/* _site/mockup

      - name: Prove the resulting site matches expectations
        run: ls -lR _site

      - name: upload artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages at swork.github.io/mcaux-ct
        id: deployment
        uses: actions/deploy-pages@v4
