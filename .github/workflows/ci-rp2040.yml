on: [push, pull_request, workflow_dispatch]

name: CI rp2040

env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcaux-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: thumbv6m-none-eabi
      - run: cargo check --features rp2040 --no-default-features --target thumbv6m-none-eabi

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcaux-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: thumbv6m-none-eabi
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcaux-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: thumbv6m-none-eabi
          components: clippy
      - run: cargo clippy --features rp2040 --no-default-features --target thumbv6m-none-eabi -- -D warnings

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcaux-app
    steps:
      - uses: actions/checkout@master
      - uses: actions-rust-lang/setup-rust-toolchain@v1.0.1
        with:
          toolchain: stable
          target: thumbv6m-none-eabi
          override: true
      - run: cargo build --features rp2040 --no-default-features --target thumbv6m-none-eabi --release

