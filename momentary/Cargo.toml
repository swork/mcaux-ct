[package]
name = "momentary"
version = "0.1.0"
edition = "2024"

[target.'cfg(target_family = "wasm")'.dependencies]
web-time = { version = "1.1.0" }

[target.'cfg(target_os = "none")'.dependencies]
embassy-time = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime"] }

[dependencies]
heapless = "0.9.2"
