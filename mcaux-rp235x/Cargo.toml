[package]
edition = "2024"
name = "mcaux-rp235x"
version = "0.1.0"
authors = ["Steve Work <steve@work.renlabs.com>"]
license = "MIT OR Apache-2.0"

publish = false

[[bin]]
name = "mcaux-rp235x"
test = false
bench = false

[dependencies]
assign-resources = "0.5.0"
cortex-m-rt = "0.7.5"
cyw43 = { version = "0.6.0", features = ["defmt", "firmware-logs"] }
cyw43-pio = { version = "0.9.0", features = ["defmt"] }
defmt = "1.0.1"
defmt-rtt = "1.1.0"
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-rp = { version = "0.9.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "binary-info", "rp235xa"] }
mcaux = { version="0.1.0", path="../mcaux", features = ["rp235xa"]}
panic-probe = { version = "1.0.0", features = ["defmt"] }
static_cell = "2.1.1"


