image: debian/trixie
packages:
  - jq
  - rustup
  - binutils-arm-none-eabi
  - rhash
tasks:
  - prep: |
      rustup toolchain install stable
      rustup target install thumbv8m.main-none-eabihf
      git clone https://git.sr.ht/~scwork/mcaux-ct m
      cargo install --path m/cargo-utility-section cargo-utility-section
  - prep_archive: |
      mkdir -p .ssh
      chmod 0700 .ssh
      cat > .ssh/known_hosts <EOF
      git.sr.ht ssh-rsa 
      git.sr.ht ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBCj6y+cJlqK3BHZRLZuM+KP2zGPrh4H66DacfliU1E2DHAd1GGwF4g1jwu3L8gOZUTIvUptqWTkmglpYhFp4Iy4=
      git.sr.ht ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMZvRd4EtM7R+IHVMWmDkVU3VLQTSwQDSAvW0t2Tkj60
      EOF
      echo "GIT_HTTP_USER_AGENT='CI support for Steve Work, steve@work.renlabs.com'; echo GIT_HTTP_USER_AGENT" >> .profile
  - build: |
      PATH=$PATH:. DFU0=http://example.org/DFU/ AP0=SSID PW0=password make -C m/mcaux
  - archive: |
      # Explore Artifact features in GraphQL API
      # git clone git@git.sr.ht:~scwork/archive a
